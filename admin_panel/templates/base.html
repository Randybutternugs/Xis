<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}TULL Site Admin{% endblock %}</title>
<style>
:root{--g:#6ABD45;--bg:#0a0a0a;--card:#111;--brd:#222;--txt:#eee;--mut:#666;--warn:#f90;--crit:#f33;--blue:#4a9eff;--sb:#2f2f2f;color-scheme:dark}
*{scrollbar-width:thin;scrollbar-color:var(--sb) var(--bg)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--sb);border:2px solid var(--bg);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--g)}
::-webkit-scrollbar-corner{background:var(--bg)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:.9em}
a{color:var(--g);text-decoration:none}a:hover{text-decoration:underline}

.nav{background:#000;border-bottom:2px solid var(--g);padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.nav-brand{display:flex;flex-direction:column;gap:3px}
.nav-brand .t{font-size:1.2em;color:var(--mut);text-transform:uppercase;letter-spacing:3px}
.nav-brand .s{font-size:.8em;color:var(--mut);font-family:monospace;letter-spacing:1px;opacity:.75}
.nav-links{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.nav-links a{padding:8px 20px;font-size:.9em;font-weight:700;text-transform:uppercase;letter-spacing:2px;border:1px solid var(--brd);color:var(--txt);text-decoration:none;transition:all .2s}
.nav-links a:hover,.nav-links a.active{background:var(--g);color:#000;border-color:var(--g)}

.container{max-width:1200px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--brd);padding:16px;margin-bottom:16px}
.card h2{font-size:.7em;color:var(--g);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.si{background:#0a0a0a;border:1px solid #1a1a1a;padding:10px}
.si label{display:block;font-size:.6em;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.si .val{font-family:'Consolas',monospace;font-size:1.3em}
.ok{color:var(--g)}.warn{color:var(--warn)}.crit{color:var(--crit)}.na{color:#333}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.dot-g{background:var(--g)}.dot-r{background:var(--crit)}.dot-y{background:var(--warn)}

.btn{padding:8px 16px;border:none;font-weight:700;font-size:.8em;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--g);color:#000}.btn-primary:hover{background:#5aa93d}
.btn-outline{background:transparent;border:1px solid var(--g);color:var(--g)}.btn-outline:hover{background:var(--g);color:#000}
.btn-danger{background:var(--crit);color:#fff}
.btn-sm{padding:5px 10px;font-size:.75em}

.badge{display:inline-block;padding:2px 8px;font-size:.65em;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.badge-ok{background:#1a3a1a;color:var(--g)}.badge-warn{background:#3a2a0a;color:var(--warn)}
.badge-crit{background:#3a1a1a;color:var(--crit)}.badge-off{background:#1a1a1a;color:var(--mut)}
.badge-done{background:#1a2a3a;color:#7ab8e0}

.flag{display:inline-block;padding:3px 10px;font-size:.7em;font-weight:700;text-transform:uppercase}
.flag-ok{background:#1a3a1a;color:var(--g)}.flag-bad{background:#3a1a1a;color:var(--crit)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.65em;color:var(--mut);text-transform:uppercase;letter-spacing:1px;padding:8px;border-bottom:1px solid var(--brd)}
td{padding:8px;border-bottom:1px solid #1a1a1a}
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav class="nav">
  <a href="/site-admin" class="nav-brand">
    <span class="t">Site Admin</span>
    <span class="s">TULL Hydroponics</span>
  </a>
  <div class="nav-links">
    {% for rule, endpoint, label in nav %}
    <a href="{{ rule }}" {% if nav_active == endpoint %}class="active"{% endif %}>{{ label }}</a>
    {% endfor %}
  </div>
</nav>
<div class="container">{% block content %}{% endblock %}</div>
<script>
// Every same-origin fetch() carries X-Requested-With. The passthrough refuses
// mutating requests without it, which blocks cross-site POSTs from other tabs
// (see admin_panel/api.py refuse_cross_site_mutations).
(function(){
  var native=window.fetch;
  window.fetch=function(input,init){
    init=init||{};
    var url=typeof input==='string'?input:(input&&input.url)||'';
    var sameOrigin=url.charAt(0)==='/'||url.indexOf(location.origin)===0;
    if(sameOrigin){
      var h=new Headers(init.headers||(input&&input.headers)||undefined);
      h.set('X-Requested-With','XMLHttpRequest');
      init.headers=h;
    }
    return native.call(window,input,init);
  };
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
